<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700"><defs><style> .box{fill:#111827;stroke:#8b9bb4;stroke-width:1.5}.head{fill:#263449}.t{font:15px Arial;fill:#f8fafc}.h{font:bold 17px Arial;fill:#fff}.line{stroke:#60a5fa;stroke-width:2;fill:none}.note{font:13px Arial;fill:#cbd5e1}</style></defs><rect width="1100" height="700" fill="#0b1220"/><text x="40" y="42" class="h" font-size="24">Guitar Shop — Entity Relationship Overview</text><rect class="box" x="40" y="100" width="230" height="92" rx="10"/><path class="head" d="M50,100 h210 q10,0 10,10 v32 h-230 v-32 q0,-10 10,-10"/><text class="h" x="54" y="127">categories</text><text class="t" x="54" y="165">PK category_id</text><text class="t" x="54" y="190">UQ category_name</text><rect class="box" x="330" y="100" width="230" height="192" rx="10"/><path class="head" d="M340,100 h210 q10,0 10,10 v32 h-230 v-32 q0,-10 10,-10"/><text class="h" x="344" y="127">products</text><text class="t" x="344" y="165">PK product_id</text><text class="t" x="344" y="190">FK category_id</text><text class="t" x="344" y="215">UQ product_code</text><text class="t" x="344" y="240">product_name</text><text class="t" x="344" y="265">list_price</text><text class="t" x="344" y="290">discount_percent</text><rect class="box" x="40" y="370" width="230" height="192" rx="10"/><path class="head" d="M50,370 h210 q10,0 10,10 v32 h-230 v-32 q0,-10 10,-10"/><text class="h" x="54" y="397">customers</text><text class="t" x="54" y="435">PK customer_id</text><text class="t" x="54" y="460">UQ email_address</text><text class="t" x="54" y="485">first_name</text><text class="t" x="54" y="510">last_name</text><text class="t" x="54" y="535">FK shipping_address_id</text><text class="t" x="54" y="560">FK billing_address_id</text><rect class="box" x="330" y="370" width="230" height="142" rx="10"/><path class="head" d="M340,370 h210 q10,0 10,10 v32 h-230 v-32 q0,-10 10,-10"/><text class="h" x="344" y="397">addresses</text><text class="t" x="344" y="435">PK address_id</text><text class="t" x="344" y="460">FK customer_id</text><text class="t" x="344" y="485">line1, city, state</text><text class="t" x="344" y="510">zip_code, phone</text><rect class="box" x="650" y="370" width="230" height="167" rx="10"/><path class="head" d="M660,370 h210 q10,0 10,10 v32 h-230 v-32 q0,-10 10,-10"/><text class="h" x="664" y="397">orders</text><text class="t" x="664" y="435">PK order_id</text><text class="t" x="664" y="460">FK customer_id</text><text class="t" x="664" y="485">FK ship_address_id</text><text class="t" x="664" y="510">FK billing_address_id</text><text class="t" x="664" y="535">order_date, ship_date</text><rect class="box" x="650" y="100" width="230" height="167" rx="10"/><path class="head" d="M660,100 h210 q10,0 10,10 v32 h-230 v-32 q0,-10 10,-10"/><text class="h" x="664" y="127">order_items</text><text class="t" x="664" y="165">PK item_id</text><text class="t" x="664" y="190">FK order_id</text><text class="t" x="664" y="215">FK product_id</text><text class="t" x="664" y="240">item_price, quantity</text><text class="t" x="664" y="265">discount_amount</text><rect class="box" x="920" y="370" width="230" height="117" rx="10"/><path class="head" d="M930,370 h210 q10,0 10,10 v32 h-230 v-32 q0,-10 10,-10"/><text class="h" x="934" y="397">administrators</text><text class="t" x="934" y="435">PK admin_id</text><text class="t" x="934" y="460">email_address</text><text class="t" x="934" y="485">first_name, last_name</text><path class="line" d="M270 150 H330"/><path class="line" d="M155 370 V300 H445 V280"/><path class="line" d="M270 420 H330"/><path class="line" d="M155 370 V300 H765 V280"/><path class="line" d="M560 420 H650"/><path class="line" d="M765 370 V280"/><path class="line" d="M880 210 V300 H765 V370"/><text x="40" y="660" class="note">PK = primary key · FK = foreign key · UQ = unique constraint. Relationships are enforced by the SQL setup scripts.</text></svg>